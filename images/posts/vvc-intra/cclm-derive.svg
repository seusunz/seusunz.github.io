<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320"><rect width="800" height="320" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">CCLM 参数推导三步：模板选点 → 排序取均值 → 两点定直线</text><rect x="30" y="50" width="230" height="200" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/><text x="145" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">① 从模板选 4 个样点对</text><rect x="80" y="96" width="22" height="22" fill="#f1f5f9" stroke="#9aa5b1"/><rect x="102" y="96" width="22" height="22" fill="#fca5a5" stroke="#9aa5b1"/><rect x="124" y="96" width="22" height="22" fill="#fca5a5" stroke="#9aa5b1"/><rect x="146" y="96" width="22" height="22" fill="#f1f5f9" stroke="#9aa5b1"/><text x="168.0" y="88" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">上方色度模板（2 个）</text><rect x="58" y="118" width="22" height="22" fill="#f1f5f9" stroke="#9aa5b1"/><rect x="58" y="140" width="22" height="22" fill="#fca5a5" stroke="#9aa5b1"/><rect x="58" y="162" width="22" height="22" fill="#fca5a5" stroke="#9aa5b1"/><rect x="58" y="184" width="22" height="22" fill="#f1f5f9" stroke="#9aa5b1"/><text x="50" y="162" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="end" font-weight="normal">左</text><text x="50" y="184" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="end" font-weight="normal">侧</text><rect x="80" y="118" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="80" y="140" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="80" y="162" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="80" y="184" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="102" y="118" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="102" y="140" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="102" y="162" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="102" y="184" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="124" y="118" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="124" y="140" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="124" y="162" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="124" y="184" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="146" y="118" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="146" y="140" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="146" y="162" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><rect x="146" y="184" width="22" height="22" fill="#dbeafe" stroke="#9aa5b1"/><text x="124" y="174" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="middle" font-weight="bold">当前色度块</text><text x="145" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">样点对 = 模板色度 + 同位置降采样亮度</text><rect x="300" y="50" width="210" height="200" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/><text x="405" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">② 按亮度排序，两两平均</text><rect x="320" y="92" width="80" height="34" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="360" y="113" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">L_min</text><rect x="320" y="138" width="80" height="34" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="360" y="159" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">C_min</text><text x="412" y="113" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="start" font-weight="normal">← 较小的两个</text><text x="412" y="159" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="start" font-weight="normal">← 样点的均值</text><rect x="320" y="184" width="80" height="34" rx="6" fill="#bfdbfe" stroke="#1f2933" stroke-width="1.4"/><text x="360" y="205" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">L_max</text><rect x="320" y="224" width="80" height="24" rx="6" fill="#bfdbfe" stroke="#1f2933" stroke-width="1.4"/><text x="360" y="240" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">C_max</text><text x="412" y="205" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="start" font-weight="normal">← 较大的两个</text><rect x="550" y="50" width="230" height="200" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/><text x="665" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">③ 两点定直线 α·L + β</text><line x1="590" y1="222" x2="750" y2="222" stroke="#1f2933" stroke-width="1.2"/><line x1="590" y1="92" x2="590" y2="222" stroke="#1f2933" stroke-width="1.2"/><text x="756" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="normal">L</text><text x="582" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="end" font-weight="normal">C</text><line x1="598" y1="214" x2="742" y2="104" stroke="#2563eb" stroke-width="2"/><circle cx="612" cy="196" r="5" fill="#c0392b"/><circle cx="726" cy="126" r="5" fill="#2563eb"/><text x="622" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#c0392b" text-anchor="start" font-weight="normal">(L_min, C_min)</text><text x="716" y="138" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#2563eb" text-anchor="end" font-weight="normal">(L_max, C_max)</text><text x="665" y="240" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">α = (C_max−C_min)/(L_max−L_min)，除法用 16 项查表</text><text x="20" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="normal">参数不传输，编解码两端各自从相邻像素推导 —— 4 次比较 + 1 次查表，不需要除法器（VTM IntraPrediction.cpp:1689-1730）。</text></svg>