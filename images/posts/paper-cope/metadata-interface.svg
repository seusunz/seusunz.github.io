<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <rect width="800" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">芯片视角：从编解码 IP 导出“面向 AI 的压缩域元数据”</text>

  <rect x="30" y="52" width="200" height="150" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
  <text x="130" y="76" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">视频编解码 IP</text>
  <text x="130" y="102" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">熵解码 / 语法解析</text>
  <text x="130" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">帧内/帧间预测</text>
  <text x="130" y="146" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">运动补偿 / 重建</text>
  <rect x="50" y="164" width="160" height="24" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="130" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="bold">块级信息通路（已有）</text>

  <rect x="300" y="80" width="200" height="110" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/>
  <text x="400" y="104" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">元数据导出接口</text>
  <text x="400" y="128" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">MV 场 / 块划分</text>
  <text x="400" y="148" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">预测模式 / QP 图</text>
  <text x="400" y="172" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="bold">额外 DMA 通路，面积代价小</text>

  <rect x="570" y="80" width="200" height="110" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/>
  <text x="670" y="104" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">VideoLM 输入</text>
  <text x="670" y="128" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">压缩域基元 → Δ-Tokens</text>
  <text x="670" y="152" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">无需完整重建为 RGB</text>
  <text x="670" y="176" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="bold">低 TTFT，省去视觉编码</text>

  <line x1="230" y1="128" x2="296" y2="128" stroke="#1f2933" stroke-width="1.6"/><polygon points="296,128 287,131.9 287,124.1" fill="#1f2933"/>
  <line x1="500" y1="128" x2="566" y2="128" stroke="#1f2933" stroke-width="1.6"/><polygon points="566,128 557,131.9 557,124.1" fill="#1f2933"/>

  <rect x="30" y="222" width="740" height="82" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/>
  <text x="44" y="244" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">两条实现路线：</text>
  <text x="44" y="264" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">① 软件只做码流解析（熵解码 + 语法解析），跳过运动补偿与重建；② 硬件解码器增加块级元数据导出接口。</text>
  <text x="44" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">注意：VVC 引入仿射、GPM、DMVR/BDOF 后，码流 MV 与最终补偿 MV 不再一一对应，需考虑这些工具带来的偏差。</text>
</svg>
