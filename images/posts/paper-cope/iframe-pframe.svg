<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <rect width="800" height="340" fill="#ffffff"/>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">CoPE-VideoLM：I 帧与 P 帧分工处理</text>

  <text x="20" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">I 帧路径：完整 RGB 编码</text>
  <rect x="30" y="76" width="130" height="52" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/>
  <text x="95" y="96" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">I 帧</text>
  <text x="95" y="114" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">少量关键帧</text>
  <line x1="160" y1="102" x2="198" y2="102" stroke="#1f2933" stroke-width="1.6"/><polygon points="198,102 189,105.9 189,98.1" fill="#1f2933"/>
  <rect x="200" y="76" width="180" height="52" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
