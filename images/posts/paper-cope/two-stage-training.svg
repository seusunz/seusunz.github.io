<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <rect width="800" height="300" fill="#ffffff"/>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">CoPE 的两阶段训练：先对齐语义，再端到端微调</text>

  <rect x="30" y="56" width="740" height="90" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="44" y="78" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">阶段一：特征对齐</text>
  <rect x="44" y="90" width="160" height="42" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/>
  <text x="124" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Δ-Encoder</text>
  <text x="124" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">压缩域特征</text>
  <line x1="204" y1="111" x2="242" y2="111" stroke="#1f2933" stroke-width="1.6"/><polygon points="242,111 233,114.9 233,107.1" fill="#1f2933"/>
  <rect x="244" y="90" width="180" height="42" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
  <text x="334" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">逼近标准视觉编码器特征</text>
  <text x="334" y="124" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">对齐表征空间</text>
  <text x="470" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="bold">目标：压缩域特征与 RGB 特征语义一致</text>

  <rect x="30" y="160" width="740" height="90" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="44" y="182" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">阶段二：端到端微调</text>
  <rect x="44" y="194" width="160" height="42" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/>
  <text x="124" y="212" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">对齐后的 Δ-Encoder</text>
  <text x="124" y="228" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">接入基础 VideoLM</text>
  <line x1="204" y1="215" x2="242" y2="215" stroke="#1f2933" stroke-width="1.6"/><polygon points="242,215 233,218.9 233,211.1" fill="#1f2933"/>
  <rect x="244" y="194" width="180" height="42" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
  <text x="334" y="212" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">端到端微调</text>
  <text x="334" y="228" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">视频理解任务</text>
  <text x="470" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="bold">目标：保留效率的同时避免语义空间不一致</text>

  <text x="20" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">两阶段的意义：先用对齐把压缩域表示“接回”标准语义空间，再微调让它真正适应视频理解任务。</text>
</svg>
