<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <rect width="800" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Nested Learning：同一张网络里的多时间尺度嵌套优化</text>

  <rect x="40" y="52" width="720" height="66" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/>
  <text x="60" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">高频 · 每 token</text>
  <text x="60" y="96" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">注意力 / 快速工作记忆：查询 → 上下文信息，即时响应新输入</text>
  <text x="700" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">快</text>

  <rect x="70" y="132" width="660" height="66" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/>
  <text x="90" y="154" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">中频 · 每段上下文</text>
  <text x="90" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">优化器状态 / 动量 / 二阶统计：历史梯度 → 当前更新策略</text>
  <text x="670" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">中</text>

  <rect x="100" y="212" width="600" height="66" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
  <text x="120" y="234" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">低频 · 离线训练</text>
  <text x="120" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">FFN / 主模型参数 W：缓慢积累稳定知识，长期记忆载体</text>
  <text x="640" y="248" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle" font-weight="bold">慢</text>

  <path d="M400,118 L400,132 M400,198 L400,212" fill="none" stroke="#52606d" stroke-width="1.4" stroke-dasharray="5,4"/>
  <text x="20" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">核心观点：模型不是单一时钟驱动的静态网络，而是多个不同更新频率的优化过程嵌套而成。</text>
  <text x="20" y="334" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">“深度”更可能来自时间与频率意义上的嵌套层次，而非单纯的空间层数。</text>
</svg>
