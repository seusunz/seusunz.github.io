<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 325" width="800" height="325"><rect width="800" height="325" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">概率模型对比：HEVC 单速率 64 状态机 vs VVC 双速率估计器</text><rect x="30" y="48" width="350" height="250" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/><text x="205" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle" font-weight="bold">HEVC：单速率有限状态机</text><rect x="60" y="130" width="40" height="26" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="80.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">0</text><rect x="100" y="130" width="40" height="26" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="120.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">1</text><rect x="140" y="130" width="40" height="26" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="160.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">2</text><rect x="180" y="130" width="40" height="26" rx="6" fill="#f1f5f9" stroke="#9aa5b1" stroke-width="1"/><text x="200.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" text-anchor="middle" font-weight="normal">…</text><rect x="220" y="130" width="40" height="26" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="240.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">62</text><rect x="260" y="130" width="40" height="26" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="280.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">63</text><rect x="300" y="130" width="40" height="26" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="320.0" y="147" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold"></text><text x="205" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606d" text-anchor="middle" font-weight="normal">pStateIdx（6 bit）：σ 越大，LPS 概率越小</text><line x1="68" y1="170" x2="332" y2="170" stroke="#059669" stroke-width="2"/><polygon points="332,170 323.9,173.9 323.9,166.1" fill="#059669"/><text x="205" y="186" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="normal">编码 MPS：σ 右移（更确信）</text><line x1="332" y1="192" x2="68" y2="192" stroke="#c0392b" stroke-width="2"/><polygon points="68,192 76.1,188.1 76.1,195.9" fill="#c0392b"/><text x="205" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="middle" font-weight="normal">编码 LPS：σ 左移（不确定）</text><text x="205" y="236" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606d" text-anchor="middle" font-weight="normal">σ = 0 时再编 LPS → 翻转 valMps</text><text x="205" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">所有上下文共用同一速率，窗口 ≈ 20 bin</text><text x="205" y="284" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="bold">存储：pStateIdx(6) + valMps(1) = 7 bit</text><rect x="420" y="48" width="350" height="250" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/><text x="595" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2933" text-anchor="middle" font-weight="bold">VVC：双速率估计器取平均</text><rect x="432" y="86" width="52" height="74" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/><text x="458" y="118" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">bin</text><line x1="484" y1="101" x2="518" y2="101" stroke="#1f2933" stroke-width="1.4"/><polygon points="518,101 509.9,104.9 509.9,97.1" fill="#1f2933"/><line x1="484" y1="143" x2="518" y2="143" stroke="#1f2933" stroke-width="1.4"/><polygon points="518,143 509.9,146.9 509.9,139.1" fill="#1f2933"/><rect x="520" y="84" width="240" height="34" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="640" y="105" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">pStateIdx0（10 bit，窗口 2^shift0，快）</text><rect x="520" y="126" width="240" height="34" rx="6" fill="#fce7f3" stroke="#1f2933" stroke-width="1.4"/><text x="640" y="147" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">pStateIdx1（14 bit，窗口 2^shift1，慢）</text><line x1="640" y1="160" x2="640" y2="178" stroke="#1f2933" stroke-width="1.6"/><polygon points="640,178 636.1,169.9 643.9,169.9" fill="#1f2933"/><rect x="520" y="180" width="240" height="30" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="640" y="199" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">q = (pStateIdx0 + pStateIdx1) &gt;&gt; 8（8 bit）</text><line x1="640" y1="210" x2="640" y2="228" stroke="#1f2933" stroke-width="1.6"/><polygon points="640,228 636.1,219.9 643.9,219.9" fill="#1f2933"/><rect x="520" y="230" width="240" height="34" rx="6" fill="#fef3c7" stroke="#1f2933" stroke-width="1.4"/><text x="640" y="243" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">折叠：q &amp; 0x80 → 取反，MSB 即 MPS</text><text x="640" y="258" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">LPS = 6bit × 4bit 小乘法，不再查表</text><text x="595" y="284" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="bold">存储（规范有效位宽）：10 + 14 + shiftIdx(4) = 28 bit</text><text x="20" y="314" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">shift0/shift1 由 4 bit shiftIdx 推导，按上下文离线训练 —— 不同语法元素拥有不同的“学习速率”。</text></svg>