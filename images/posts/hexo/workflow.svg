<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400"><rect width="800" height="400" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Hexo 博客的双仓库工作流：一次写作，两条推送</text><rect x="30" y="52" width="380" height="300" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="8,5"/><text x="220" y="76" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" text-anchor="middle" font-weight="bold">本机</text><rect x="60" y="92" width="130" height="48" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/><text x="125" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Markdown 文章</text><text x="125" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">source/_posts/</text><line x1="190" y1="116" x2="228" y2="116" stroke="#1f2933" stroke-width="1.6"/><polygon points="228,116 219.9,119.9 219.9,112.1" fill="#1f2933"/><text x="209" y="106" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="bold">hexo g</text><rect x="230" y="92" width="130" height="48" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="295" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">public/ 静态网页</text><text x="295" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">由主题渲染生成</text><line x1="295" y1="140" x2="295" y2="206" stroke="#52606d" stroke-width="1.4" stroke-dasharray="5,4"/><polygon points="295,206 291.1,197.9 298.9,197.9" fill="#52606d"/><rect x="230" y="208" width="130" height="44" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4,3"/><text x="295" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">hexo server</text><text x="295" y="242" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">本地预览 :4000</text><line x1="360" y1="116" x2="452" y2="116" stroke="#2563eb" stroke-width="2"/><polygon points="452,116 443.9,119.9 443.9,112.1" fill="#2563eb"/><text x="406" y="106" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2563eb" text-anchor="middle" font-weight="bold">hexo deploy</text><line x1="125" y1="148" x2="125" y2="205" stroke="#c0392b" stroke-width="1.8"/><polygon points="125,205 121.1,196.9 128.9,196.9" fill="#c0392b"/><text x="115" y="172" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c0392b" text-anchor="end" font-weight="bold">git push</text><text x="115" y="186" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="end" font-weight="normal">源码 + 配置</text><rect x="60" y="208" width="130" height="44" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="125" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">源码仓库 blog</text><text x="125" y="243" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">source/ 配置 主题</text><rect x="455" y="92" width="180" height="48" rx="6" fill="#fef3c7" stroke="#1f2933" stroke-width="1.4"/><text x="545" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">用户名.github.io</text><text x="545" y="129" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">只放生成的 HTML</text><line x1="545" y1="140" x2="545" y2="168" stroke="#1f2933" stroke-width="1.6"/><polygon points="545,168 541.1,159.9 548.9,159.9" fill="#1f2933"/><rect x="455" y="170" width="180" height="44" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="545" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">GitHub Pages 托管</text><text x="545" y="205" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">https://用户名.github.io</text><line x1="545" y1="214" x2="545" y2="242" stroke="#1f2933" stroke-width="1.6"/><polygon points="545,242 541.1,233.9 548.9,233.9" fill="#1f2933"/><rect x="470" y="244" width="150" height="40" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="545" y="268" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">读者</text><path d="M455,230 L360,230 L190,230" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/><polygon points="190.0,230.0 198.1,226.1 198.1,233.9" fill="#c0392b"/><text x="330" y="202" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="normal">换电脑：克隆 + npm install 恢复</text><rect x="50" y="286" width="340" height="50" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/><text x="220" y="306" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="middle" font-weight="bold">源码仓库 .gitignore：node_modules/ public/ .deploy*/ db.json</text><text x="220" y="322" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="bold">非公开资料（个人文档等）务必一并忽略 —— 仓库是公开的</text><text x="20" y="384" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606d" text-anchor="start" font-weight="normal">发布三步：hexo clean → hexo generate → hexo deploy；源码另用 git push 备份。</text></svg>