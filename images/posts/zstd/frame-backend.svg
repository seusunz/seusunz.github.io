<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340">
  <rect width="800" height="340" fill="#ffffff"/>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">ZSTD 帧/块结构与算术编解码后端的位置</text>

  <rect x="30" y="52" width="740" height="66" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/>
  <text x="50" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">Frame</text>
  <rect x="120" y="64" width="120" height="42" rx="4" fill="#f8fafc" stroke="#1f2933" stroke-width="1.2"/>
  <text x="180" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">Frame Header</text>
  <rect x="260" y="64" width="160" height="42" rx="4" fill="#f8fafc" stroke="#1f2933" stroke-width="1.2"/>
  <text x="340" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">Block 1</text>
  <rect x="436" y="64" width="160" height="42" rx="4" fill="#f8fafc" stroke="#1f2933" stroke-width="1.2"/>
  <text x="516" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">Block 2</text>
  <rect x="612" y="64" width="138" height="42" rx="4" fill="#f8fafc" stroke="#1f2933" stroke-width="1.2"/>
  <text x="681" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle">Block N</text>

  <text x="20" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">Block 内部</text>
  <rect x="30" y="164" width="350" height="70" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/>
  <text x="205" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Literals（字面量）</text>
  <text x="205" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">Huffman 编码</text>
  <line x1="380" y1="199" x2="418" y2="199" stroke="#1f2933" stroke-width="1.6"/><polygon points="418,199 409,202.9 409,195.1" fill="#1f2933"/>
  <rect x="420" y="164" width="350" height="70" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
  <text x="595" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">Sequences（序列）</text>
  <text x="595" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">FSE 编码</text>

  <rect x="30" y="256" width="740" height="64" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.4"/>
  <text x="50" y="278" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">算术编解码后端</text>
  <text x="50" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">概率状态更新 → 区间更新 → 码流生成/恢复 → 按 Block/Frame 组织输出，块结束时做收尾与对齐</text>
</svg>
