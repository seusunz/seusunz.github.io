<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330"><rect width="520" height="330" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">MPM 推导使用的两个邻块位置</text><rect x="190" y="80" width="200" height="160" fill="#e8f5e9" stroke="#1f2933" stroke-width="1.5"/><text x="290.0" y="165.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">当前块</text><rect x="168" y="218" width="22" height="22" fill="#fde68a" stroke="#1f2933"/><text x="179.0" y="234.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">A</text><text x="160" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal">左邻（左下角样点左侧）</text><rect x="368" y="58" width="22" height="22" fill="#dbeafe" stroke="#1f2933"/><text x="379.0" y="74.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">B</text><text x="362" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal">上邻（右上角样点上方）</text><text x="20" y="280" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">邻块不可用、非帧内、使用 MIP 时按 Planar 处理；上邻块不在同一 CTU 时也按 Planar 处理，</text><text x="20" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">这样 MPM 推导不需要缓存上一 CTU 行的帧内模式，省掉一条行缓存。</text></svg>