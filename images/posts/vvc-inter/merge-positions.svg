<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs><rect width="760" height="340" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Merge 候选的空域与时域位置</text><rect x="110" y="90" width="180" height="150" fill="#e8f5e9" stroke="#1f2933" stroke-width="1.5"/><text x="200.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="normal">当前 CU</text><rect x="84" y="214" width="26" height="26" fill="#fde68a" stroke="#1f2933"/><text x="97.0" y="231.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">A1</text><rect x="84" y="240" width="26" height="26" fill="#fde68a" stroke="#1f2933"/><text x="97.0" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">A0</text><rect x="264" y="64" width="26" height="26" fill="#dbeafe" stroke="#1f2933"/><text x="277.0" y="81.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">B1</text><rect x="290" y="64" width="26" height="26" fill="#dbeafe" stroke="#1f2933"/><text x="303.0" y="81.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">B0</text><rect x="84" y="64" width="26" height="26" fill="#e5e7eb" stroke="#1f2933"/><text x="97.0" y="81.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">B2</text><text x="200.0" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">空域：按 B1 → A1 → B0 → A0 → (B2) 检查</text><rect x="470" y="90" width="180" height="150" fill="#f3f4f6" stroke="#1f2933" stroke-width="1.5" stroke-dasharray="6 4"/><text x="560.0" y="114" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="middle" font-weight="normal">同位图像中的同位块</text><rect x="547.0" y="152.0" width="26" height="26" fill="#fcd5ce" stroke="#1f2933"/><text x="560.0" y="169.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">C1</text><rect x="650" y="240" width="26" height="26" fill="#fcd5ce" stroke="#1f2933"/><text x="663.0" y="257.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">C0</text><text x="560.0" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">时域：优先 C0（右下），不可用或越出 CTU 行时用 C1（中心）</text><text x="20" y="322" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">最多 4 个空域候选；只对 A1-B1、B0-B1、A0-A1、B2-A1/B1 几对做去重比较，而不是两两全比，以减少比较器数量。</text></svg>