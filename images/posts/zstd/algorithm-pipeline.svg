<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">ZSTD 完整压缩算法链路：从输入到码流</text>

  <rect x="30" y="52" width="140" height="56" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/>
  <text x="100" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">输入分块</text>
  <text x="100" y="94" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">window / block ≤128KB</text>
  <line x1="170" y1="80" x2="208" y2="80" stroke="#1f2933" stroke-width="1.6"/><polygon points="208,80 199,83.9 199,76.1" fill="#1f2933"/>
  <rect x="210" y="52" width="170" height="56" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
  <text x="295" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">序列生成（前端）</text>
  <text x="295" y="94" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">hash / lazy / opt + LDM</text>
  <line x1="380" y1="80" x2="418" y2="80" stroke="#1f2933" stroke-width="1.6"/><polygon points="418,80 409,83.9 409,76.1" fill="#1f2933"/>
  <rect x="420" y="52" width="150" height="56" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
  <text x="495" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">长度/偏移转 code</text>
  <text x="495" y="94" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">LL / ML / OF + extra bits</text>
  <line x1="570" y1="80" x2="608" y2="80" stroke="#1f2933" stroke-width="1.6"/><polygon points="608,80 599,83.9 599,76.1" fill="#1f2933"/>
  <rect x="610" y="52" width="160" height="56" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
  <text x="690" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">熵编码后端</text>
  <text x="690" y="94" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#059669" text-anchor="middle" font-weight="bold">本文主角</text>

  <rect x="30" y="136" width="740" height="150" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.2"/>
  <text x="44" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">Compressed Block 的两条熵编码路径</text>

  <text x="44" y="184" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">字面量路径</text>
  <rect x="150" y="170" width="130" height="46" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/>
  <text x="215" y="188" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">字面量字节</text>
  <text x="215" y="205" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle">litLength 覆盖外的字节</text>
  <line x1="280" y1="193" x2="318" y2="193" stroke="#1f2933" stroke-width="1.6"/><polygon points="318,193 309,196.9 309,189.1" fill="#1f2933"/>
  <rect x="320" y="170" width="170" height="46" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
  <text x="405" y="188" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">Huffman 编码</text>
  <text x="405" y="205" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle">1X / 4X 流，表逐块自适应</text>
  <line x1="490" y1="193" x2="528" y2="193" stroke="#1f2933" stroke-width="1.6"/><polygon points="528,193 519,196.9 519,189.1" fill="#1f2933"/>
  <rect x="530" y="170" width="220" height="46" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.4"/>
  <text x="640" y="188" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">Literals Section</text>
  <text x="640" y="205" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle">header + Huffman 表 + 位流</text>

  <text x="44" y="244" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">序列路径</text>
  <rect x="150" y="230" width="130" height="46" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/>
  <text x="215" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">LL / ML / OF code</text>
  <text x="215" y="265" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle">长度与偏移已转 code</text>
  <line x1="280" y1="253" x2="318" y2="253" stroke="#1f2933" stroke-width="1.6"/><polygon points="318,253 309,256.9 309,249.1" fill="#1f2933"/>
  <rect x="320" y="230" width="170" height="46" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
  <text x="405" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">FSE（tANS）编码</text>
  <text x="405" y="265" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle">三张表，状态并行</text>
  <line x1="490" y1="253" x2="528" y2="253" stroke="#1f2933" stroke-width="1.6"/><polygon points="528,253 519,256.9 519,249.1" fill="#1f2933"/>
  <rect x="530" y="230" width="220" height="46" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.4"/>
  <text x="640" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="middle" font-weight="bold">Sequences Section</text>
  <text x="640" y="265" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle">header + 3 张 FSE 表 + 位流</text>

  <rect x="30" y="306" width="740" height="76" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/>
  <text x="44" y="328" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">Block 类型：Raw(0) / RLE(1) / Compressed(2) / Reserved(3) —— 只有 Compressed 进入上述熵编码</text>
  <text x="44" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">逐块自适应：Huffman 表与 3 张 FSE 表可新建（写描述表）或 set_repeat（复用前块，只写标志）</text>
  <text x="44" y="372" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">参考实现入口：zstd_compress.c:4399 ZSTD_compressBlock_internal → :4431 entropyCompressSeqStore</text>
</svg>
