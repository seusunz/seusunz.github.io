<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300"><rect width="800" height="300" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">常规 bin 编码的串行依赖环：为什么单引擎约 1 bin/cycle</text><rect x="40" y="70" width="128" height="74" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="104.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">ctxIdx 计算</text><text x="104.0" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">由前序结果决定</text><text x="104.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">读哪个上下文</text><line x1="168" y1="107.0" x2="192" y2="107.0" stroke="#2563eb" stroke-width="2"/><polygon points="192,107.0 183.9,110.9 183.9,103.1" fill="#2563eb"/><rect x="192" y="70" width="128" height="74" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="256.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">CTX SRAM 读</text><text x="256.0" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">pState0/1 或</text><text x="256.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">pStateIdx+valMps</text><line x1="320" y1="107.0" x2="344" y2="107.0" stroke="#2563eb" stroke-width="2"/><polygon points="344,107.0 335.9,110.9 335.9,103.1" fill="#2563eb"/><rect x="344" y="70" width="128" height="74" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="408.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">LPS 计算</text><text x="408.0" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">VVC: 6bit×4bit 乘法</text><text x="408.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">HEVC: 64×4 查表</text><line x1="472" y1="107.0" x2="496" y2="107.0" stroke="#2563eb" stroke-width="2"/><polygon points="496,107.0 487.9,110.9 487.9,103.1" fill="#2563eb"/><rect x="496" y="70" width="128" height="74" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="560.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Range/Low 更新</text><text x="560.0" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">区间分裂</text><text x="560.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">+ 移位</text><line x1="624" y1="107.0" x2="648" y2="107.0" stroke="#2563eb" stroke-width="2"/><polygon points="648,107.0 639.9,110.9 639.9,103.1" fill="#2563eb"/><rect x="648" y="70" width="128" height="74" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="712.0" y="92" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">概率更新</text><text x="712.0" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">状态转移/</text><text x="712.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">双速率更新</text><path d="M712.0,144 L712.0,190 L104.0,190 L104.0,152" fill="none" stroke="#c0392b" stroke-width="2"/><polygon points="104.0,152.0 107.9,160.1 100.1,160.1" fill="#c0392b"/><text x="408.0" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">写回 SRAM 后才能开始下一个 bin（读改写依赖）</text><rect x="320" y="222" width="360" height="34" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="500" y="239" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">bypass bin：不进此环，N 个合并成一拍（如 4 bin/cycle）</text><path d="M104.0,190 L104.0,239 L318,239" fill="none" stroke="#059669" stroke-width="1.8" stroke-dasharray="5,4"/><text x="20" y="290" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">WPP/Tile 在行与块粒度并行；环内优化：概率 forwarding、查表/乘法前置、读写流水。</text></svg>