<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330">
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">算术编解码链路的流式接口与回压控制</text>

  <rect x="30" y="60" width="140" height="56" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/>
  <text x="100" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">上游输入</text>
  <text x="100" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">序列 / 字面量</text>
  <line x1="170" y1="88" x2="208" y2="88" stroke="#1f2933" stroke-width="1.6"/><polygon points="208,88 199,91.9 199,84.1" fill="#1f2933"/>
  <rect x="210" y="60" width="130" height="56" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/>
  <text x="275" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">入口 FIFO</text>
  <text x="275" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">吸收上游突发</text>
  <line x1="340" y1="88" x2="378" y2="88" stroke="#1f2933" stroke-width="1.6"/><polygon points="378,88 369,91.9 369,84.1" fill="#1f2933"/>
  <rect x="380" y="60" width="180" height="56" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
  <text x="470" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">算术编解码流水</text>
  <text x="470" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">概率/区间更新 + 状态</text>
  <line x1="560" y1="88" x2="598" y2="88" stroke="#1f2933" stroke-width="1.6"/><polygon points="598,88 589,91.9 589,84.1" fill="#1f2933"/>
  <rect x="600" y="60" width="150" height="56" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.4"/>
  <text x="675" y="82" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">码流输出</text>
  <text x="675" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle">按消费能力输出</text>

  <path d="M675,116 L675,148 L100,148 L100,116" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4"/>
  <polygon points="100,116 96,125 104,125" fill="#c0392b"/>
  <text x="400" y="143" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">回压：下游消费慢 → 逐级向上传播，暂停/恢复时状态必须停在同一拍</text>

  <rect x="30" y="172" width="740" height="136" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/>
  <text x="44" y="196" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">回压控制要点</text>
  <text x="44" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">① 入口 FIFO 吸收上游突发，避免直接背压到上游；</text>
  <text x="44" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">② 出口按下游码流消费能力控制输出，避免堆积；</text>
  <text x="44" y="264" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">③ 中间级用 valid/ready 握手，让回压能逐级、同步传播；</text>
  <text x="44" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="bold">④ 暂停/恢复时，概率状态、区间状态与 FIFO 指针必须停在同一拍，否则状态错位。</text>
</svg>
