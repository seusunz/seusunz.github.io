<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350"><rect width="800" height="350" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">ALF 的两级拆分：统计跟 CTU 流水，推导与滤波在帧级</text><text x="20" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">主流水（逐 CTU，与去块/SAO 共用 60000 cycle/CTU）</text><rect x="30" y="68" width="120" height="56" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.2"/><text x="90" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">CTU 0</text><text x="90" y="105" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">去块/SAO</text><text x="90" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="bold">+ STAT 统计</text><line x1="150" y1="96" x2="168" y2="96" stroke="#52606d" stroke-width="1.4"/><polygon points="168,96 159.9,99.9 159.9,92.1" fill="#52606d"/><rect x="170" y="68" width="120" height="56" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.2"/><text x="230" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">CTU 1</text><text x="230" y="105" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">去块/SAO</text><text x="230" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="bold">+ STAT 统计</text><line x1="290" y1="96" x2="308" y2="96" stroke="#52606d" stroke-width="1.4"/><polygon points="308,96 299.9,99.9 299.9,92.1" fill="#52606d"/><rect x="310" y="68" width="120" height="56" rx="6" fill="#f8fafc" stroke="#9aa5b1" stroke-width="1.2"/><text x="370" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">CTU 2</text><text x="370" y="105" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">去块/SAO</text><text x="370" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="bold">+ STAT 统计</text><line x1="430" y1="96" x2="448" y2="96" stroke="#52606d" stroke-width="1.4"/><polygon points="448,96 439.9,99.9 439.9,92.1" fill="#52606d"/><rect x="450" y="68" width="120" height="56" rx="6" fill="#fafafa" stroke="#1f2933" stroke-width="1.2"/><text x="510" y="88" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">CTU N</text><text x="510" y="105" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">去块/SAO</text><text x="510" y="118" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="bold">+ STAT 统计</text><text x="450" y="60" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#52606d" text-anchor="start" font-weight="normal">…</text><text x="230" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="normal">统计逐 CTU 累加（协方差对像素可加，双核各自统计后相加）</text><rect x="600" y="68" width="170" height="110" rx="6" fill="#f1f5f9" stroke="#9aa5b1" stroke-width="1.4" stroke-dasharray="6,4"/><text x="685" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">DDR</text><text x="685" y="112" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">统计结果（逐 CTU 写入）</text><text x="685" y="128" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">重构图像</text><text x="685" y="144" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">（STAT/FILTER 经 DDR）</text><line x1="570" y1="96" x2="598" y2="96" stroke="#059669" stroke-width="1.6"/><polygon points="598,96 589.9,99.9 589.9,92.1" fill="#059669"/><text x="20" y="218" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="start" font-weight="bold">帧级（帧尾启动）</text><rect x="90" y="228" width="220" height="62" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/><text x="200" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">DERIVE 推导（≈182k cycle）</text><text x="200" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">解方程 / clip 搜索 / 量化</text><text x="200" y="280" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="bold">帧级 ALF on/off 判定</text><line x1="310" y1="259" x2="348" y2="259" stroke="#1f2933" stroke-width="1.6"/><polygon points="348,259 339.9,262.9 339.9,255.1" fill="#1f2933"/><rect x="350" y="228" width="200" height="62" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="450" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">FILTER 滤波</text><text x="450" y="266" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">ALF on 时：读回重构图像</text><text x="450" y="280" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">逐 4×4 滤波后写回</text><path d="M685,178 L685,205 L200,205 L200,226" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4,4"/><polygon points="200.0,226.0 196.1,217.9 203.9,217.9" fill="#52606d"/><text x="440" y="219" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">读回统计</text><path d="M550,259 L600,259 L600,180" fill="none" stroke="#52606d" stroke-width="1.5" stroke-dasharray="4,4"/><polygon points="600.0,180.0 603.9,188.1 596.1,188.1" fill="#52606d"/><text x="575" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">图像往返</text><path d="M30,196 L640,196" fill="none" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="8,5"/><text x="636" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="end" font-weight="bold">帧尾</text><text x="20" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="normal">on/off 到帧级才能确定，而 CABAC 必须在 CTU 流水里编码 → 每个 CTU 同时编出 ALF on / off 两路码流。</text></svg>