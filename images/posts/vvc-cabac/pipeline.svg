<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 385" width="800" height="385"><rect width="800" height="385" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">CABAC 编码管线全景：语法元素到码流的完整通路</text><rect x="30" y="52" width="150" height="48" rx="6" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/><text x="105" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">语法元素 SE</text><text x="105" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">划分/模式/MVD/系数</text><line x1="180" y1="76" x2="218" y2="76" stroke="#1f2933" stroke-width="1.6"/><polygon points="218,76 209.9,79.9 209.9,72.1" fill="#1f2933"/><rect x="220" y="52" width="170" height="48" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="305" y="72" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">① 二值化</text><text x="305" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">TR / EGk / FL / SU</text><line x1="390" y1="76" x2="428" y2="76" stroke="#1f2933" stroke-width="1.6"/><polygon points="428,76 419.9,79.9 419.9,72.1" fill="#1f2933"/><rect x="430" y="52" width="100" height="48" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/><text x="480" y="74" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">bin 串</text><text x="480" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">0/1 序列</text><path d="M480,100 L480,118 L110,118 L110,153" fill="none" stroke="#2563eb" stroke-width="1.8"/><polygon points="110.0,153.0 106.1,144.9 113.9,144.9" fill="#2563eb"/><text x="126" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="bold">常规 bin（带上下文）</text><path d="M510,100 L510,150" fill="none" stroke="#52606d" stroke-width="1.4"/><polygon points="510.0,150.0 506.1,141.9 513.9,141.9" fill="#52606d"/><text x="524" y="128" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="normal">terminate</text><path d="M530,86 L640,86 L640,150" fill="none" stroke="#52606d" stroke-width="1.4"/><polygon points="640.0,150.0 636.1,141.9 643.9,141.9" fill="#52606d"/><text x="588" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="normal">bypass bin</text><rect x="40" y="155" width="140" height="40" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="110" y="172" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">② 上下文选择</text><text x="110" y="188" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">ctxIdx</text><line x1="180" y1="175" x2="218" y2="175" stroke="#1f2933" stroke-width="1.6"/><polygon points="218,175 209.9,178.9 209.9,171.1" fill="#1f2933"/><rect x="220" y="152" width="200" height="46" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="320" y="170" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">③ 概率估计</text><text x="320" y="188" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">HEVC: 64 状态查表 / VVC: 双速率</text><line x1="420" y1="175" x2="498" y2="175" stroke="#2563eb" stroke-width="2"/><polygon points="498,175 489.9,178.9 489.9,171.1" fill="#2563eb"/><rect x="500" y="150" width="200" height="78" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="600" y="174" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">④ 算术编码引擎</text><text x="600" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">Range / Low 更新</text><text x="600" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">LPS = f(prob, Range)</text><line x1="600" y1="228" x2="600" y2="262" stroke="#1f2933" stroke-width="1.6"/><polygon points="600,262 596.1,253.9 603.9,253.9" fill="#1f2933"/><rect x="500" y="264" width="200" height="50" rx="6" fill="#fef3c7" stroke="#1f2933" stroke-width="1.4"/><text x="600" y="284" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">⑤ 重归一化与字节输出</text><text x="600" y="302" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">0xFF 缓冲 / 进位处理</text><line x1="600" y1="314" x2="600" y2="340" stroke="#1f2933" stroke-width="1.6"/><polygon points="600,340 596.1,331.9 603.9,331.9" fill="#1f2933"/><rect x="540" y="342" width="120" height="34" rx="6" fill="#f1f5f9" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4,4"/><text x="600" y="363" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">码流 bitstream</text><path d="M530,228 L530,246 L320,246 L320,200" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5,4"/><polygon points="320.0,200.0 323.9,208.1 316.1,208.1" fill="#c0392b"/><text x="424" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="normal">概率写回（供下一个 bin 使用）</text><text x="20" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">bypass 不查上下文、不更新 Range，可 N 个合并成一拍（multi-bin）；terminate 仅用于 slice 结束等场景。</text></svg>