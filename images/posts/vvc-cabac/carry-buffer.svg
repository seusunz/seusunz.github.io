<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330"><rect width="800" height="330" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">字节输出级：进位传播与 0xFF 缓冲（可从 bin 编码环路剥离）</text><rect x="40" y="56" width="150" height="40" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="115" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">Low 高位</text><text x="115" y="89" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">取 leadByte</text><line x1="115" y1="96" x2="115" y2="118" stroke="#1f2933" stroke-width="1.6"/><polygon points="115,118 111.1,109.9 118.9,109.9" fill="#1f2933"/><path d="M115,118 L185,158 L115,198 L45,158 Z" fill="none" stroke="#fef9c3" stroke-width="1.6"/><text x="115" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">leadByte</text><text x="115" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">== 0xFF ?</text><line x1="185" y1="158" x2="258" y2="158" stroke="#1f2933" stroke-width="1.6"/><polygon points="258,158 249.9,161.9 249.9,154.1" fill="#1f2933"/><text x="216" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="bold">是</text><rect x="260" y="138" width="190" height="40" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="355" y="156" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">numBufferedBytes++</text><text x="355" y="171" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">0xFF 可能被进位改写，先缓存</text><line x1="115" y1="198" x2="115" y2="218" stroke="#1f2933" stroke-width="1.6"/><polygon points="115,218 111.1,209.9 118.9,209.9" fill="#1f2933"/><text x="124" y="214" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="start" font-weight="bold">否</text><rect x="40" y="220" width="190" height="60" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="135" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">carry = leadByte &gt;&gt; 8</text><text x="135" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">输出 bufferedByte + carry</text><text x="135" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">补输出 (0xFF+carry)&amp;0xFF × N</text><rect x="500" y="150" width="130" height="40" rx="6" fill="#f1f5f9" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4,4"/><text x="565" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">输出 FIFO</text><line x1="630" y1="170" x2="658" y2="170" stroke="#1f2933" stroke-width="1.6"/><polygon points="658,170 649.9,173.9 649.9,166.1" fill="#1f2933"/><rect x="660" y="150" width="120" height="40" rx="6" fill="#fef3c7" stroke="#1f2933" stroke-width="1.4"/><text x="720" y="175" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">码流</text><path d="M230,240 L400,240 L400,170 L498,170" fill="none" stroke="#1f2933" stroke-width="1.6"/><polygon points="498.0,170.0 489.9,173.9 489.9,166.1" fill="#1f2933"/><path d="M355,178 L355,220 L394,220" fill="none" stroke="#52606d" stroke-width="1.4" stroke-dasharray="4,4"/><polygon points="394.0,220.0 385.9,223.9 385.9,216.1" fill="#52606d"/><text x="338" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="end" font-weight="normal">flush 时</text><rect x="470" y="216" width="310" height="96" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/><text x="625" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">进位实例：缓冲 … 27 FF FF，新字节带进位</text><text x="625" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c0392b" text-anchor="middle" font-weight="bold">… 27 FF FF + carry=1 → … 28 00 00</text><text x="625" y="284" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">只需“一个普通字节 + 一个 0xFF 计数器”</text><text x="625" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="middle" font-weight="normal">即可表示任意长的待定字节串</text></svg>