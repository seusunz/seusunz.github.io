<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350"><rect width="800" height="350" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">H.265 编码流水线逐环节看：哪些对张量有效，哪些可以删</text><rect x="30" y="60" width="150" height="56" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/><text x="105" y="82" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">LLM 张量</text><text x="105" y="100" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">权重 / KV cache / 梯度</text><line x1="180" y1="88" x2="218" y2="88" stroke="#1f2933" stroke-width="1.6"/><polygon points="218,88 209.9,91.9 209.9,84.1" fill="#1f2933"/><rect x="220" y="60" width="170" height="56" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="305" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">切分成 2D 块</text><text x="305" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">当作视频“帧”来编</text><line x1="390" y1="88" x2="418" y2="88" stroke="#1f2933" stroke-width="1.6"/><polygon points="418,88 409.9,91.9 409.9,84.1" fill="#1f2933"/><rect x="420" y="60" width="88" height="56" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="464" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">帧内预测</text><text x="464" y="93" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#52606d" text-anchor="middle" font-weight="normal">通道间分布呈</text><text x="464" y="104" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#52606d" text-anchor="middle" font-weight="normal">结构（边缘/平坦）</text><text x="464" y="132" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="bold">✓ 有效</text><line x1="508" y1="88" x2="526" y2="88" stroke="#1f2933" stroke-width="1.6"/><polygon points="526,88 517.9,91.9 517.9,84.1" fill="#1f2933"/><rect x="526" y="60" width="88" height="56" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="570" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">变换 DCT</text><text x="570" y="93" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#52606d" text-anchor="middle" font-weight="normal">把异常值分摊到</text><text x="570" y="104" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#52606d" text-anchor="middle" font-weight="normal">块内多个位置</text><text x="570" y="132" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="bold">✓ 有效</text><line x1="614" y1="88" x2="632" y2="88" stroke="#1f2933" stroke-width="1.6"/><polygon points="632,88 623.9,91.9 623.9,84.1" fill="#1f2933"/><rect x="632" y="60" width="88" height="56" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="676" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">量化</text><text x="676" y="93" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#52606d" text-anchor="middle" font-weight="normal">配合 DCT 稳定</text><text x="676" y="104" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#52606d" text-anchor="middle" font-weight="normal">后续熵编码</text><text x="676" y="132" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="bold">✓ 有效</text><line x1="720" y1="88" x2="738" y2="88" stroke="#1f2933" stroke-width="1.6"/><polygon points="738,88 729.9,91.9 729.9,84.1" fill="#1f2933"/><rect x="738" y="60" width="88" height="56" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="782" y="78" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">熵编码</text><text x="782" y="93" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#52606d" text-anchor="middle" font-weight="normal">高频符号</text><text x="782" y="104" font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#52606d" text-anchor="middle" font-weight="normal">分配短码字</text><text x="782" y="132" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="bold">✓ 有效</text><line x1="742" y1="88" x2="762" y2="88" stroke="#1f2933" stroke-width="1.6"/><polygon points="762,88 753.9,91.9 753.9,84.1" fill="#1f2933"/><text x="776" y="82" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">码流</text><rect x="220" y="180" width="200" height="56" rx="6" fill="#f1f5f9" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5,4"/><text x="320" y="202" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">帧间预测 / 运动估计</text><text x="320" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="middle" font-weight="normal">张量间无运动关系，无收益</text><text x="320" y="248" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="middle" font-weight="bold">✗ 对张量无效 —— 专用张量编解码器可整块删除</text><path d="M320,180 L320,160 L420,160 L420,120" fill="none" stroke="#52606d" stroke-width="1.4" stroke-dasharray="5,4"/><text x="440" y="154" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">跳过此环节</text><rect x="220" y="282" width="500" height="44" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/><text x="470" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">系统落点：GPU 自带的 NVENC/NVDEC 即可执行编码/解码，</text><text x="470" y="316" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">不占用张量核心，吞吐由视频编解码硬件直接决定</text><path d="M470,282 L470,262 L470,262" fill="none" stroke="#52606d" stroke-width="1.2"/><text x="20" y="344" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="normal">对应 VcLLM 论文第 3 节的消融：熵编码、DCT、帧内预测均带来正收益，帧间预测无收益。</text></svg>