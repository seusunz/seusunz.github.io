<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300"><rect width="800" height="300" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">VVC 解码环路：重建样点依次经过四级处理，输出又回到预测</text><rect x="40" y="100" width="92" height="64" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="86.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">预测 + 残差</text><text x="86.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">帧内/帧间</text><line x1="132" y1="132.0" x2="144" y2="132.0" stroke="#1f2933" stroke-width="1.6"/><polygon points="144,132.0 135.9,135.9 135.9,128.1" fill="#1f2933"/><rect x="144" y="100" width="92" height="64" rx="6" fill="#f8fafc" stroke="#1f2933" stroke-width="1.4"/><text x="190.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">重建</text><text x="190.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">（映射域）</text><line x1="236" y1="132.0" x2="248" y2="132.0" stroke="#1f2933" stroke-width="1.6"/><polygon points="248,132.0 239.9,135.9 239.9,128.1" fill="#1f2933"/><rect x="248" y="100" width="92" height="64" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="294.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">LMCS⁻¹</text><text x="294.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">反向映射</text><line x1="340" y1="132.0" x2="352" y2="132.0" stroke="#1f2933" stroke-width="1.6"/><polygon points="352,132.0 343.9,135.9 343.9,128.1" fill="#1f2933"/><rect x="352" y="100" width="92" height="64" rx="6" fill="#e0f2fe" stroke="#1f2933" stroke-width="1.4"/><text x="398.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">DBF</text><text x="398.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">去块滤波</text><line x1="444" y1="132.0" x2="456" y2="132.0" stroke="#1f2933" stroke-width="1.6"/><polygon points="456,132.0 447.9,135.9 447.9,128.1" fill="#1f2933"/><rect x="456" y="100" width="92" height="64" rx="6" fill="#fce7f3" stroke="#1f2933" stroke-width="1.4"/><text x="502.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">SAO</text><text x="502.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">边/带补偿</text><line x1="548" y1="132.0" x2="560" y2="132.0" stroke="#1f2933" stroke-width="1.6"/><polygon points="560,132.0 551.9,135.9 551.9,128.1" fill="#1f2933"/><rect x="560" y="100" width="92" height="64" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="606.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">ALF</text><text x="606.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">维纳滤波（最大头）</text><line x1="652" y1="132.0" x2="664" y2="132.0" stroke="#1f2933" stroke-width="1.6"/><polygon points="664,132.0 655.9,135.9 655.9,128.1" fill="#1f2933"/><rect x="664" y="100" width="92" height="64" rx="6" fill="#fef3c7" stroke="#1f2933" stroke-width="1.4"/><text x="710.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">CCALF</text><text x="710.0" y="146" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#52606d" text-anchor="middle" font-weight="normal">亮度修色度</text><line x1="756" y1="132.0" x2="786" y2="132.0" stroke="#1f2933" stroke-width="1.6"/><polygon points="786,132.0 777.9,135.9 777.9,128.1" fill="#1f2933"/><text x="770" y="90" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="middle" font-weight="bold">解码图像</text><text x="770" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1f2933" text-anchor="middle" font-weight="bold">缓存 DPB</text><path d="M770,190 L770,226 L86.0,226 L86.0,168" fill="none" stroke="#c0392b" stroke-width="2"/><polygon points="86.0,168.0 89.9,176.1 82.1,176.1" fill="#c0392b"/><text x="400" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">输出图像作为参考帧回到预测 —— 这就是“环路”的含义</text><text x="20" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start" font-weight="normal">顺序固定：LMCS⁻¹ → DBF → SAO → ALF → CCALF；DBF 与 SAO 按 CTU 流水执行，ALF 的系数要等整帧统计（见 ALF 项目复盘）。</text></svg>