<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330"><rect width="800" height="330" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">编码 LPS 时的区间分裂与重归一化（编码 MPS 时取另一半区间，过程对称）</text><text x="110" y="54" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">① 当前区间 [Low, Low+Range)，Range ∈ [256, 510]</text><rect x="110" y="64" width="400" height="34" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="310.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">MPS 子区间（宽 Range − LPS）</text><rect x="510" y="64" width="160" height="34" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="590.0" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">LPS</text><text x="100" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="end" font-weight="normal">Low</text><text x="680" y="86" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Low+Range</text><text x="110" y="138" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">② 编码 LPS：Low 移到 LPS 段起点，新 Range = LPS（可能 &lt; 256）</text><rect x="510" y="148" width="160" height="34" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="590.0" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">LPS</text><line x1="590.0" y1="102" x2="590.0" y2="144" stroke="#c0392b" stroke-width="2"/><polygon points="590.0,144 586.1,135.9 593.9,135.9" fill="#c0392b"/><text x="578.0" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="end" font-weight="normal">Low += (Range − LPS)</text><text x="110" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">③ 重归一化：整体左移 s 位直到 Range ≥ 256，Low 高位推出为码流</text><path d="M590.0,186 L590.0,214 L300,214 L300,234" fill="none" stroke="#52606d" stroke-width="1.6"/><polygon points="300.0,234.0 296.1,225.9 303.9,225.9" fill="#52606d"/><text x="430" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#52606d" text-anchor="middle" font-weight="normal">左移 s 位</text><rect x="200" y="240" width="200" height="34" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="300" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">LPS &lt;&lt; s（新 Range）</text><line x1="190" y1="257" x2="176" y2="257" stroke="#52606d" stroke-width="1.4"/><polygon points="176,257 184.1,253.1 184.1,260.9" fill="#52606d"/><line x1="174" y1="257" x2="160" y2="257" stroke="#52606d" stroke-width="1.4"/><polygon points="160,257 168.1,253.1 168.1,260.9" fill="#52606d"/><line x1="158" y1="257" x2="144" y2="257" stroke="#52606d" stroke-width="1.4"/><polygon points="144,257 152.1,253.1 152.1,260.9" fill="#52606d"/><text x="120" y="261" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="end" font-weight="normal">推出位</text><text x="20" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">s = 6 时 Range 也 ≥ 256（LPS 最小值 4）→ 0~6 位移位器即可；MPS 路径最多左移 1 位；bypass 不移位。</text></svg>