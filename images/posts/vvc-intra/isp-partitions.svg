<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300"><rect width="640" height="300" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">ISP 子分区划分（亮度）</text><rect x="30" y="60" width="150" height="150" fill="#e8f5e9" stroke="#1f2933" stroke-width="1.5"/><line x1="30" y1="97.5" x2="180" y2="97.5" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/><line x1="30" y1="135.0" x2="180" y2="135.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/><line x1="30" y1="172.5" x2="180" y2="172.5" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/><text x="105.0" y="82.75" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">1</text><text x="105.0" y="120.25" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">2</text><text x="105.0" y="157.75" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">3</text><text x="105.0" y="195.25" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">4</text><text x="105.0" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">水平划分：4 个 W×H/4</text><rect x="220" y="60" width="150" height="150" fill="#e8f5e9" stroke="#1f2933" stroke-width="1.5"/><line x1="257.5" y1="60" x2="257.5" y2="210" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/><line x1="295.0" y1="60" x2="295.0" y2="210" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/><line x1="332.5" y1="60" x2="332.5" y2="210" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/><text x="238.75" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">1</text><text x="276.25" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">2</text><text x="313.75" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">3</text><text x="351.25" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">4</text><text x="295.0" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">垂直划分：4 个 W/4×H</text><rect x="420" y="60" width="60" height="120" fill="#e8f5e9" stroke="#1f2933" stroke-width="1.5"/><line x1="420" y1="120.0" x2="480" y2="120.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="5 3"/><text x="450.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">1</text><text x="450.0" y="154.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">2</text><text x="450.0" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">8×4 / 4×8：只分 2 份</text><text x="530" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7b8794" text-anchor="start" font-weight="normal">4×4：不可用 ISP</text><text x="20" y="280" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">子分区按编号顺序依次预测、重建；前一子分区的重建像素作为下一子分区的参考。所有子分区共用一个帧内模式。</text></svg>