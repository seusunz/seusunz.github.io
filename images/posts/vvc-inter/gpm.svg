<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs><rect width="760" height="330" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">GPM 几何划分：两个单向预测按分割线混合</text><clipPath id="cp"><rect x="70" y="70" width="200" height="200"/></clipPath><g clip-path="url(#cp)"><polygon points="70,70 270,70 270,110 70,220" fill="#dbeafe"/><polygon points="70,220 270,110 270,270 70,270" fill="#fde68a"/><polygon points="70,206 270,96 270,124 70,234" fill="#e9d5ff" opacity="0.85"/></g><line x1="70" y1="220" x2="270" y2="110" stroke="#c0392b" stroke-width="2"/><rect x="70" y="70" width="200" height="200" fill="none" stroke="#1f2933" stroke-width="1.5"/><text x="130" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="bold">分区 0</text><text x="200" y="240" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="bold">分区 1</text><rect x="320" y="90" width="16" height="16" fill="#dbeafe" stroke="#9aa5b1"/><text x="346" y="103" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">分区 0：来自 Merge 列表候选 m 的单向 MV</text><rect x="320" y="120" width="16" height="16" fill="#fde68a" stroke="#9aa5b1"/><text x="346" y="133" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">分区 1：来自候选 n（n ≠ m）的单向 MV</text><rect x="320" y="150" width="16" height="16" fill="#e9d5ff" stroke="#9aa5b1"/><text x="346" y="163" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">混合带：沿分割线按距离渐变加权（0~8/8）</text><text x="320" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">分割线由角度与偏移决定，共 64 种划分方式；</text><text x="320" y="232" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="start" font-weight="normal">只编码划分方式索引和两个 Merge 候选索引。</text><text x="20" y="312" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">每个分区只用单向预测，最坏情况的参考像素带宽与普通双向预测相同。</text></svg>