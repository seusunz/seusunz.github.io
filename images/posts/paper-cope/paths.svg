<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360"><rect width="800" height="360" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">CoPE 的关键：P 帧不再恢复成图像，压缩域基元直接变 Token</text><text x="20" y="62" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="bold">传统 VideoLM：每帧都走完整像素链路</text><rect x="30" y="74" width="100" height="40" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.4"/><text x="80" y="98" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">视频</text><line x1="130" y1="94" x2="158" y2="94" stroke="#1f2933" stroke-width="1.6"/><polygon points="158,94 149.9,97.9 149.9,90.1" fill="#1f2933"/><rect x="160" y="74" width="150" height="40" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="235" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">逐帧完整解码 RGB</text><text x="235" y="106" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">（I/P 帧一视同仁）</text><line x1="310" y1="94" x2="338" y2="94" stroke="#1f2933" stroke-width="1.6"/><polygon points="338,94 329.9,97.9 329.9,90.1" fill="#1f2933"/><rect x="340" y="74" width="170" height="40" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="425" y="98" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">重型视觉编码器（ViT）</text><line x1="510" y1="94" x2="538" y2="94" stroke="#1f2933" stroke-width="1.6"/><polygon points="538,94 529.9,97.9 529.9,90.1" fill="#1f2933"/><rect x="540" y="74" width="150" height="40" rx="6" fill="#fde2e2" stroke="#1f2933" stroke-width="1.4"/><text x="615" y="92" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#c0392b" text-anchor="middle" font-weight="bold">大量视觉 Token</text><text x="615" y="106" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="normal">每帧数百个</text><text x="20" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#059669" text-anchor="start" font-weight="bold">CoPE-VideoLM：I 帧保语义，P 帧只编“变化”</text><rect x="30" y="190" width="100" height="40" rx="6" fill="#f1f5f9" stroke="#1f2933" stroke-width="1.4"/><text x="80" y="214" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">视频</text><line x1="130" y1="210" x2="158" y2="210" stroke="#1f2933" stroke-width="1.6"/><polygon points="158,210 149.9,213.9 149.9,206.1" fill="#1f2933"/><rect x="160" y="190" width="150" height="40" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="235" y="208" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">编解码器（压缩域）</text><text x="235" y="222" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">不恢复完整图像</text><path d="M310,206 L338,206 L338,262" fill="none" stroke="#1f2933" stroke-width="1.6"/><path d="M310,214 L338,214 L338,158" fill="none" stroke="#1f2933" stroke-width="1.6"/><rect x="340" y="148" width="190" height="40" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/><text x="435" y="166" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">I 帧：完整 RGB 编码</text><text x="435" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">静态语义 Token</text><rect x="340" y="252" width="190" height="40" rx="6" fill="#fef9c3" stroke="#1f2933" stroke-width="1.4"/><text x="435" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">P 帧：MV + 残差</text><text x="435" y="284" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">→ Δ-Encoder（轻量）</text><line x1="530" y1="168" x2="558" y2="190" stroke="#1f2933" stroke-width="1.4"/><polygon points="558,190 549.2,188.1 554.1,181.9" fill="#1f2933"/><line x1="530" y1="272" x2="558" y2="250" stroke="#1f2933" stroke-width="1.4"/><polygon points="558,250 554.1,258.1 549.2,251.9" fill="#1f2933"/><rect x="560" y="200" width="130" height="40" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/><text x="625" y="218" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#059669" text-anchor="middle" font-weight="bold">少量 Δ-Token</text><text x="625" y="232" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#52606d" text-anchor="middle" font-weight="normal">（每帧个位数）</text><line x1="690" y1="220" x2="718" y2="220" stroke="#1f2933" stroke-width="1.6"/><polygon points="718,220 709.9,223.9 709.9,216.1" fill="#1f2933"/><text x="756" y="220" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2933" text-anchor="middle" font-weight="bold">LLM</text><rect x="30" y="306" width="480" height="40" rx="6" fill="#fafafa" stroke="#9aa5b1" stroke-width="1"/><text x="270" y="324" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2933" text-anchor="middle" font-weight="bold">收益：Token 大幅减少 + P 帧绕开重型编码链路 →</text><text x="270" y="340" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2563eb" text-anchor="middle" font-weight="bold">单卡 4090 上 TTFT 2.39 s → 0.33 s（约 −86%）</text><text x="660" y="306" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">两阶段训练：先对齐视觉特征，</text><text x="660" y="322" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">再端到端微调，避免压缩域</text><text x="660" y="338" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#52606d" text-anchor="start" font-weight="normal">与语义空间不一致</text></svg>