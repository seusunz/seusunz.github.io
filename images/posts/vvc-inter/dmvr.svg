<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs><rect width="760" height="330" fill="#ffffff"/><text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">DMVR 双边匹配：在 MV 两端做镜像偏移，找 SAD 最小点</text><rect x="60" y="90" width="160" height="150" fill="#f9fafb" stroke="#1f2933" stroke-width="1.2"/><text x="140" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">L0 参考帧</text><rect x="300" y="90" width="160" height="150" fill="#f9fafb" stroke="#1f2933" stroke-width="1.2"/><text x="380" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">当前帧</text><rect x="540" y="90" width="160" height="150" fill="#f9fafb" stroke="#1f2933" stroke-width="1.2"/><text x="620" y="80" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="bold">L1 参考帧</text><rect x="364" y="149.0" width="32" height="32" fill="#e8f5e9" stroke="#1f2933" stroke-width="1.5"/><text x="380" y="207.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">当前块</text><rect x="134" y="127.0" width="32" height="32" fill="#dbeafe" stroke="#1f2933" stroke-dasharray="4 3"/><rect x="594" y="171.0" width="32" height="32" fill="#fde68a" stroke="#1f2933" stroke-dasharray="4 3"/><line x1="380" y1="165.0" x2="150" y2="143.0" stroke="#9aa5b1" stroke-width="1.2"/><line x1="380" y1="165.0" x2="610" y2="187.0" stroke="#9aa5b1" stroke-width="1.2"/><line x1="150" y1="143.0" x2="128" y2="129.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/><line x1="610" y1="187.0" x2="632" y2="201.0" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/><text x="120" y="119.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">MV0 + Δ</text><text x="644" y="221.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">MV1 − Δ</text><text x="20" y="280" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">前提：两个参考帧分别位于当前帧前后，且到当前帧的 POC 距离相等，所以偏移可以镜像。</text><text x="20" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" text-anchor="start" font-weight="normal">整数搜索 ±2（5×5 共 25 个点）比较 SAD，再用参数化误差曲面估计亚像素偏移；按 16×16 子块分别细化。</text></svg>