<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330">
  <rect width="800" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">芯片视角：更新频率 → 存储层次的映射（作者推演，非论文结论）</text>

  <rect x="20" y="52" width="760" height="76" rx="6" fill="#fde2e1" stroke="#1f2933" stroke-width="1.4"/>
  <text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">高频 · 每个 token</text>
  <text x="40" y="96" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">NL 角色：快速记忆、在线适应</text>
  <text x="40" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">硬件：靠近计算单元的可写存储（SRAM / 寄存器堆），读写带宽与计算同量级</text>

  <rect x="20" y="140" width="760" height="76" rx="6" fill="#dbeafe" stroke="#1f2933" stroke-width="1.4"/>
  <text x="40" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">中频 · 每段上下文</text>
  <text x="40" y="184" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">NL 角色：局部模式整合</text>
  <text x="40" y="204" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2933" text-anchor="start" font-weight="bold">硬件：片上缓存，按块写回</text>

  <rect x="20" y="228" width="760" height="76" rx="6" fill="#d1fae5" stroke="#1f2933" stroke-width="1.4"/>
  <text x="40" y="250" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2933" text-anchor="start" font-weight="bold">低频 · 离线训练</text>
  <text x="40" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">NL 角色：长期知识</text>
  <text x="40" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="bold">硬件：HBM 中只读，继续激进量化压缩</text>

  <text x="20" y="322" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#52606d" text-anchor="start">通则：更新越频繁的状态，越应该离计算越近；推理芯片需要“小规模训练”通路与更高比例的可写片上存储。</text>
</svg>
